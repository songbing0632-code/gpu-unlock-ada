name: Sync upstream

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync main with upstream
        uses: actions/github-script@v7
        with:
          script: |
            const upstream = 'JustAResearcher/gpu-unlock-ada';
            const [owner, repo] = upstream.split('/');
            const branch = 'main';
            const ref = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            await github.rest.repos.mergeUpstream({ owner: context.repo.owner, repo: context.repo.repo, branch });
            core.info(`Synced ${upstream}@${ref.data.object.sha} into ${context.repo.owner}/${context.repo.repo}@${branch}`);

      - name: Check for mature Windows RTX 4060 support signal
        uses: actions/github-script@v7
        with:
          script: |
            const upstream = await github.rest.repos.get({ owner: 'JustAResearcher', repo: 'gpu-unlock-ada' });
            const branch = upstream.data.default_branch;
            const readme = await github.rest.repos.getContent({ owner: 'JustAResearcher', repo: 'gpu-unlock-ada', path: 'README.md', ref: branch });
            const text = Buffer.from(readme.data.content, 'base64').toString('utf8').toLowerCase();
            const hasWindows4060Pair = /(?:windows[\\s\\S]{0,300}(?:rtx 4060|10de:2882|ad107)|(?:rtx 4060|10de:2882|ad107)[\\s\\S]{0,300}windows)/.test(text);
            const hasMaturity = /stable|production|supported on windows|windows support|release/.test(text);
            if (!hasWindows4060Pair || !hasMaturity) {
              core.info('No Windows RTX 4060 maturity signal found.');
              return;
            }
            const title = 'Review: possible mature Windows RTX 4060 support';
            const issues = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            if (issues.data.some(issue => issue.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: '上游 README 出现了 RTX 4060/AD107 与 Windows 及成熟度关键词的组合，请人工核对具体硬件、驱动、版本和回滚方案后再决定是否尝试。此 issue 只是提醒，不代表已验证支持。'
            });
